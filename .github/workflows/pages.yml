name: Deploy Biology Course Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website files and JSON manifest
        run: |
          mkdir -p public/data
          cp index.html styles.css app.js public/
          cp -R data/. public/data/
          python3 - <<'PY'
          import json
          import os

          root = "public/data"
          files = []
          for current, _, names in os.walk(root):
              for name in names:
                  if name.lower().endswith(".json") and name.lower() != "index.json":
                      rel = os.path.relpath(os.path.join(current, name), root)
                      files.append(rel.replace(os.sep, "/"))
          files.sort()
          with open(os.path.join(root, "index.json"), "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)
          print(f"Generated manifest with {len(files)} JSON files")
          PY
          touch public/.nojekyll
          test -s public/index.html
          test -s public/app.js
          test -s public/data/index.json
          python3 -c 'import json; p="public/data/index.json"; data=json.load(open(p, encoding="utf-8")); assert data, "No JSON lesson files found in data/"; print("Verified", len(data), "JSON files")'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
